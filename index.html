<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Replay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      Plausible analytics. Replace data-domain below with the real Vercel
      domain (e.g. "replay.vercel.app") before this starts reporting. The
      tagged-events variant is required so analytics.ts can fire custom
      events with props via window.plausible(event, { props }).
    -->
    <script
      defer
      data-domain="REPLACE_WITH_VERCEL_DOMAIN"
      src="https://plausible.io/js/script.tagged-events.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
